name: coremark
uvm_test: uvmt_$(CV_CORE_LC)_firmware_test_c
default_cflags: >
    -O3
    -mabi=ilp32
    -march=$(CV_SW_MARCH)
    -falign-functions=16
    -funroll-all-loops
    -falign-jumps=4
    -finline-functions
    -Wall
    -static
    -pedantic
    -DPERFORMANCE_RUN=1
    -DITERATIONS=10
    -DFLAGS_STR=\""-mabi=ilp32 -O3 -falign-functions=16 -funroll-all-loops -falign-jumps=4 -finline-functions -Wall -pedanic -nostartfiles -static"\"
description: >
    Runs the CoreMark benchmark
