# Test definition YAML for test

# Debug trigger directed test
# Asserts debug_req_i  while processing an illegal insn
#
# PARKED, and it cannot become a self-checking PASS: the debug entry itself
# works, but the assertion its debug ROM makes about that entry is a
# placeholder.  Measured on Questa One 2025.3_2, `--tb uvmt`, USE_ISS=NO
# (it does not link at all without the test_fail label handlers.S
# provides):
#
#   * main() writes the debug-request register and then executes `dret`, which
#     is itself an illegal instruction outside debug mode.  The request has
#     start_delay 0, so the hart is halted on that `dret` at 0x000041c0.
#   * _debugger_illegal_and_req (debugger.S) reads dpc and asserts it is 0
#     ("Test expects entry of exception handler to be stored in dpc").  dpc
#     holds the PC the hart halted on - 0x000041c0 - so the assert trips:
#       UVM_ERROR @ 38591.800 ns ... [VP_IDX_0] VP Status Flags: TEST FAILED WITH CODE 1
#   * The failing store is followed by the end of the debug ROM; the core runs
#     off it into unimplemented space and the consecutive-illegal-cycle lockup
#     check aborts the run (cve2_controller.sv:182, "SIMULATION FAILED - ABORTED").
#
# Whether 0x41c0 or 0 is the correct stop is a step-and-compare (RVFI/ISS)
# question, which is exactly what "known miscompares" in the name means; the
# assertions are therefore left untouched.  The bar for this test is "builds,
# links and runs and leaves a log", not PASS.
name: debug_test_known_miscompares
uvm_test: uvmt_$(CV_CORE_LC)_firmware_test_c
program: debug_test_known_miscompares
description: >
    Debug trigger directed test for tests with known failures in step-and-compare

